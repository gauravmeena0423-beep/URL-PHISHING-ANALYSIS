<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 300px; background: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; padding: 15px; margin: 0; }
        h2 { margin-top: 0; color: #60a5fa; font-size: 18px; text-align: center; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        #url-display { font-size: 12px; color: #94a3b8; word-wrap: break-word; margin-bottom: 15px; background: #1e293b; padding: 8px; border-radius: 6px; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #475569; cursor: not-allowed; }
        
        #result-box { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; text-align: center; }
        .safe { background: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; }
        .danger { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; }
        
        .score { font-size: 24px; font-weight: bold; margin: 5px 0; }
        .text-safe { color: #4ade80; }
        .text-danger { color: #f87171; }
    </style>
</head>
<body>

    <h2>🛡️ PhishGuard</h2>
    
    <div id="url-display">Fetching URL...</div>
    
    <button id="scan-btn">SCAN CURRENT PAGE</button>

    <div id="result-box">
        <div id="verdict"></div>
        <div class="score" id="score">0%</div>
        <div style="font-size: 12px; color: #cbd5e1;">Risk Score</div>
    </div>

    <!-- JS file ko link karna zaroori hai -->
    <script src="popup.js"></script>
</body>
</html>
